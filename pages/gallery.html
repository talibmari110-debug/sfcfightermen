<section class="page-wrap gallery-page">
  <header class="page-heading feature-heading gallery-heading">
    <span class="eyebrow">FANDOMVERSE VISUAL COLLECTION</span>
    <h1>Worlds in <span>pictures.</span></h1>
    <p>Browse artwork from every community. Select a picture to see it up close.</p>
  </header>
  <div class="page-tools">
    <label for="galleryCategory">Show pictures from</label>
    <select class="form-select" id="galleryCategory"><option value="all">All communities</option></select>
  </div>
  <div class="full-gallery-grid" id="FullGalleryGrid" aria-live="polite"></div>
</section>
<div class="modal fade" id="fullImageModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl"><div class="modal-content full-image-modal">
    <div class="modal-header"><h2 class="modal-title" id="fullImageTitle">FandomVerse gallery</h2><button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Close image"></button></div>
    <div class="modal-body"><img id="fullImageView" src="images/anime.jpeg" alt="Gallery picture"></div>
  </div></div>
</div>
