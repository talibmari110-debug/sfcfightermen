<section class="page-wrap">
  <header class="page-heading"><p class="eyebrow">FIND YOUR NEXT FAVORITE</p><h1>Fan <span class="purple-text">Shop</span></h1></header>
  <div class="shop-tools">
    <label for="shopCategory">Category</label>
    <select id="shopCategory" class="form-select"><option value="all">All fandoms</option></select>
    <label for="shopSort">Sort By</label>
    <select id="shopSort" class="form-select">
      <option value="default">Default</option>
      <option value="price-low">Sort By Low Price</option>
      <option value="price-high">Sort By High Price</option>
      <option value="name">Sort By Name</option>
    </select>
    <a class="simple-button ms-auto" href="?page=cart" data-page="cart">View cart (<span id="shopCartCount">0</span>)</a>
  </div>
  <div class="row g-4" id="ShopGrid"></div>
</section>
