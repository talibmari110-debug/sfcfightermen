
<section class="page-wrap narrow-page">
    <header class="page-heading">
        <p class="eyebrow">YOUR FAN ACCOUNT</p>
        <h1>Sign <span class="purple-text">in</span></h1>
    </header>

    <div id="loginAlertBox"
         class="site-auth-alert mb-3"
         style="display: none;">
    </div>

    <form class="info-panel contact-form" id="loginForm">

        <!-- Email -->
        <label for="loginEmail">Email Address</label>
        <input
            id="loginEmail"
            name="email"
            type="email"
            class="form-control"
            autocomplete="email"
            maxlength="254"
            placeholder="e.g. user@example.com"
            required
        >

        <!-- Password -->
        <label for="loginPassword" class="mt-3">Password</label>
        <input
            id="loginPassword"
            name="password"
            type="password"
            class="form-control"
            autocomplete="current-password"
            minlength="8"
            maxlength="64"
            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9\s])\S{8,64}"
            title="Password must be 8–64 characters and contain at least one uppercase letter, one lowercase letter, one number, and one special character. Spaces are not allowed."
            placeholder="Enter your password"
            required
        >

        <small class="text-muted d-block mt-1">
            Use at least 8 characters, including uppercase, lowercase,
            a number, and a special character.
        </small>

        <!-- Submit Button -->
        <button class="simple-button mt-3" type="submit">
            <i class="fa-solid fa-right-to-bracket me-2"></i>
            Sign in
        </button>

        <!-- Register Link -->
        <div class="mt-4 text-center">
            <span class="text-muted">Don't have an account yet?</span>
            <a href="?page=register"
               data-page="register"
               class="purple-text fw-bold ms-1">
                Create an account
            </a>
        </div>

    </form>
</section>
