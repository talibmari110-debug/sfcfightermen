<section class="page-wrap narrow-page"><header class="page-heading"><p class="eyebrow">JOIN THE COMMUNITY</p><h1>Create your <span class="purple-text">account</span></h1><p>This front-end example shows a confirmation and does not create or save an account.</p></header><form class="info-panel contact-form" id="demoForm"><label for="registerName">Your name</label><input id="registerName" name="name" class="form-control" type="text" autocomplete="name" required><label for="registerEmail">Email</label><input id="registerEmail" name="email" type="email" class="form-control" autocomplete="email" required><label for="registerPassword">Password</label><input id="registerPassword" name="password" type="password" class="form-control" autocomplete="new-password" required><button class="simple-button" type="submit">Create account</button></form></section>
